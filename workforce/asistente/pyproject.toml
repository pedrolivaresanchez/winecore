[project]
name = "asistente"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "timbal>=2.8.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["agent.py", "policy.py", "prompt.py"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["timbal", "timbal.*", "pydantic"]
ignore_missing_imports = true
